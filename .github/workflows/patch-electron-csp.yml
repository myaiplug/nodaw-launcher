name: Patch Electron CSP

on:
  push:
    branches:
      - feat/seamless-pro-upgrades
    paths:
      - .github/workflows/patch-electron-csp.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feat/seamless-pro-upgrades
          fetch-depth: 0

      - name: Allow production entitlement API in packaged CSP
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('electron/main.cjs')
          text = path.read_text()
          old = "connect-src 'self';"
          new = "connect-src 'self' https://entitlements.nodawlabs.com;"
          if new in text:
              print('CSP already patched')
          elif old in text:
              path.write_text(text.replace(old, new, 1))
              print('CSP patched')
          else:
              raise SystemExit('Expected connect-src directive not found')
          PY

      - name: Verify packaged CSP
        run: grep -F "connect-src 'self' https://entitlements.nodawlabs.com;" electron/main.cjs

      - name: Commit patch if changed
        shell: bash
        run: |
          if git diff --quiet -- electron/main.cjs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add electron/main.cjs
          git commit -m "fix: allow entitlement API in packaged Electron CSP"
          git push origin HEAD:feat/seamless-pro-upgrades
